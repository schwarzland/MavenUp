settings.versionAutoSelectionMode.latestMinor=Select latest minor version in current major line
settings.syncMavenAfterUpdate=Sync Maven changes after update
settings.syncMavenAfterUpdate.comment=Re-imports the Maven project after writing pom.xml updates so the IDE refreshes its model.
settings.autoSearchVersions=Search for new versions automatically
settings.autoSearchVersions.comment=Runs after the tool window loads the project data and after every finished Maven import or resync. When disabled, versions are only fetched on demand.
settings.stopAfterCentralSuccess=Stop after a successful Maven Central lookup
settings.stopAfterCentralSuccess.comment=Faster and reduces network load, but may miss versions that exist only in private repositories.
settings.hideUnstableVersions=Hide unstable versions
settings.hideUnstableVersions.comment=Hides release candidates, betas, milestones, and other qualifier-based versions from the selection lists.
settings.offerAllVersions=Offer all versions
settings.offerAllVersions.comment=Includes versions older than the current one so downgrades become possible. When disabled, only versions greater than or equal to the current one are offered.
settings.confirmVersionReset=Confirm before resetting all version selections
settings.confirmVersionReset.comment=The confirmation dialog of "Reset All to Current Versions" offers a "Don't ask again" option that also clears this setting.
settings.hiddenVersionQualifiers=Hidden version qualifiers (comma-separated):
settings.checkTransitiveDependencies=Include resolved transitive dependencies
settings.checkTransitiveDependencies.comment=Checks the resolved Maven dependency tree for update candidates and vulnerability findings.

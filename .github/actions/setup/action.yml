name: Set up build environment
description: Check out the repository and configure Java and Gradle

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

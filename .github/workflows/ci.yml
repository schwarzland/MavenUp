name: Build and Test

on:
  # Push-Builds laufen nur auf main. Feature- und Release-Branches werden ausschliesslich
  # ueber den pull_request-Trigger (gegen main) gebaut. So wird verhindert, dass ein Push
  # auf einen Branch mit offenem PR zwei identische Builds ausloest.
  push:
    branches:
      - main
    # Nur Quellcode, Plugin-Ressourcen und Build-Konfiguration starten die CI.
    # Änderungen an README, CHANGELOG, sonstiger Dokumentation oder Workflows
    # lösen keinen Build aus. Neue Dateien unter diesen Pfaden werden ebenfalls erfasst.
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

  # Dieser Trigger sorgt dafür, dass die Pipeline bereits ausgeführt wird, wenn ein
  # Pull Request gegen main erstellt oder aktualisiert wird (opened, synchronize, reopened).
  # So wird sichergestellt, dass der PR getestet wird, bevor er überhaupt gemergt werden kann.
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

# Least-Privilege: Der Job benoetigt nur Lesezugriff auf das Repository.
permissions:
  contents: read

# Bei mehreren Pushes auf denselben Branch laufende Builds abbrechen und nur den
# neuesten ausfuehren, um CI-Zeit zu sparen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Schritt 1: Quellcode aus dem Repository auschecken.
      - name: Checkout Code
        uses: actions/checkout@v7

      # Schritt 2: JDK 21 (Zulu-Distribution) einrichten, passend zur Projektkonfiguration und Compiler-Zielversion.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      # Schritt 3: Gradle einrichten; übernimmt automatisches Dependency-Caching und Berechtigungsmanagement für gradlew.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Schritt 4: Quellcode kompilieren, Unit-Tests ausführen, statische Analyse (detekt),
      # Coverage-Report (Kover) erzeugen und Plugin-Struktur/Deskriptoren verifizieren.
      # detekt schlägt nur bei NEUEN Befunden fehl; Bestandsbefunde sind über
      # config/detekt/baseline.xml eingefroren. '--no-daemon' gibt CI-Ressourcen sauber frei.
      - name: Build, Test, Analyze and Verify Plugin
        run: ./gradlew build verifyPlugin detekt koverXmlReport --no-daemon

      # Schritt 5: Test- und Analyse-Berichte als Artefakt hochladen, um Coverage (Kover),
      # detekt-Befunde und Testergebnisse direkt im GitHub-UI einsehen zu koennen. Laeuft
      # sowohl bei erfolgreichem als auch bei fehlgeschlagenem Build (nur bei Abbruch nicht).
      - name: Upload test and analysis reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/detekt
            build/reports/kover
          if-no-files-found: ignore
          retention-days: 7

name: Build and Test

on:
  push:
    branches:
      - main
      - feature/**
      - release/**

  # Dieser Trigger sorgt dafür, dass die Pipeline bereits ausgeführt wird, wenn ein
  # Pull Request gegen main erstellt oder aktualisiert wird (opened, synchronize, reopened).
  # So wird sichergestellt, dass der PR getestet wird, bevor er überhaupt gemergt werden kann.
  pull_request:
    branches: [ "main" ]

# Least-Privilege: Der Job benoetigt nur Lesezugriff auf das Repository.
permissions:
  contents: read

# Bei mehreren Pushes auf denselben Branch laufende Builds abbrechen und nur den
# neuesten ausfuehren, um CI-Zeit zu sparen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Schritt 1: Quellcode aus dem Repository auschecken.
      - name: Checkout Code
        uses: actions/checkout@v4

      # Schritt 2: JDK 21 (Zulu-Distribution) einrichten, passend zur Projektkonfiguration und Compiler-Zielversion.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # Schritt 3: Gradle einrichten; übernimmt automatisches Dependency-Caching und Berechtigungsmanagement für gradlew.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Schritt 4: Quellcode kompilieren, Unit-Tests ausführen und Plugin-Struktur/Deskriptoren verifizieren.
      # '--no-daemon' wird genutzt, um CI-Ressourcen sauber freizugeben und verwaiste Hintergrundprozesse zu vermeiden.
      - name: Build, Test and Verify Plugin
        run: ./gradlew build verifyPlugin --no-daemon

      # Schritt 5: Bei fehlgeschlagenem Build die Testberichte als Artefakt hochladen,
      # um die Fehlersuche direkt im GitHub-UI anhand der HTML/XML-Reports zu ermöglichen.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          retention-days: 7

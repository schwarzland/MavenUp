name: Build and Test

on:
  push:
    branches:
      - main
      - feature/**
      - release/**

  # Dieser Trigger sorgt dafür, dass die Pipeline bereits ausgeführt wird, wenn ein
  # Pull Request gegen main erstellt oder aktualisiert wird (opened, synchronize, reopened).
  # So wird sichergestellt, dass der PR getestet wird, bevor er überhaupt gemergt werden kann.
  pull_request:
    branches: [ "main" ]

# Least-Privilege: Der Job benoetigt nur Lesezugriff auf das Repository.
permissions:
  contents: read

# Bei mehreren Pushes auf denselben Branch laufende Builds abbrechen und nur den
# neuesten ausfuehren, um CI-Zeit zu sparen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Quellcode auschecken.
      - uses: actions/checkout@v5

      # JDK 21 (Zulu-Distribution) bereitstellen.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      # Gradle einrichten; uebernimmt automatisch das Caching der Gradle-Dependencies.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # './gradlew build' fuehrt ueber die check-Task bereits die Tests mit aus,
      # daher genuegt ein einziger Schritt. '--no-daemon' ist in CI-Umgebungen ueblich.
      - name: Build and test with Gradle
        run: ./gradlew build --no-daemon

      # Bei fehlgeschlagenem Build die Testberichte als Artefakt hochladen,
      # um die Fehlersuche zu erleichtern.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          retention-days: 7
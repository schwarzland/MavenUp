name: Create Draft Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

# Least-Privilege: Schreibzugriff für das Erstellen von GitHub Releases
permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    steps:
      # Quellcode auschecken (v4 ist die aktuelle stabile Version)
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDK 21 bereitstellen
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # Gradle Setup inkl. Caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bauen und Testen des Plugins mit buildPlugin
      - name: Build, Test and Verify Plugin
        run: ./gradlew buildPlugin verifyPlugin --no-daemon

      # Bei Fehlern Testberichte sichern
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          retention-days: 7

      # GitHub Draft-Release erstellen und ZIP-Datei anhängen
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: build/distributions/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
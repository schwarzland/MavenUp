name: Dependency Review

on:
  # Prueft ausschliesslich Pull Requests gegen 'main' und nur dann, wenn sich die Build-
  # oder Abhaengigkeitskonfiguration geaendert hat. Aenderungen am Quellcode koennen den
  # Abhaengigkeitsgraph nicht beeinflussen.
  pull_request:
    branches: [ "main" ]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/dependency-review.yml'

# 'contents: write' wird von der Dependency Submission API benoetigt, um den Graph des
# PR-Branches zu melden; 'pull-requests: write' erlaubt die Zusammenfassung als PR-Kommentar.
permissions:
  contents: write
  pull-requests: write

# Bei mehreren Pushes auf denselben Pull Request laufende Pruefungen abbrechen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull Requests aus Forks erhalten nur einen lesenden GITHUB_TOKEN und koennen den
    # Abhaengigkeitsgraph daher nicht melden. Solche Pull Requests werden uebersprungen
    # und bleiben durch die Dependabot-Warnungen auf 'main' abgedeckt.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Schritt 1: Repository auschecken.
      - name: Checkout Code
        uses: actions/checkout@v7

      # Schritt 2: JDK bereitstellen. Die gemeinsame Composite-Action './.github/actions/setup'
      # wird hier bewusst NICHT verwendet, weil sie zusaetzlich 'gradle/actions/setup-gradle'
      # ausfuehrt; 'dependency-submission' bringt die Gradle-Konfiguration bereits selbst mit.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      # Schritt 3: Abhaengigkeitsgraph des PR-Branches aufloesen und melden. Ohne diesen
      # Schritt koennte die Pruefung den Stand des Pull Requests nicht mit 'main' vergleichen,
      # weil Gradle-Abhaengigkeiten nicht statisch aus den Build-Dateien ableitbar sind.
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6

      # Schritt 4: Neu hinzugekommene Abhaengigkeiten gegen die GitHub Advisory Database
      # pruefen. Der Job schlaegt fehl, sobald der Pull Request eine Abhaengigkeit mit einer
      # bekannten Schwachstelle ab Schweregrad 'moderate' einfuehrt. Die Retry-Optionen sind
      # noetig, weil der in Schritt 3 gemeldete Snapshot serverseitig kurz verzoegert
      # verfuegbar wird.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

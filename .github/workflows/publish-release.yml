name: Publish Release to Marketplace

on:
  # Wird ausgelöst, wenn ein Release veröffentlicht wird
  release:
    types: [published]

# Least-Privilege: Der Job benötigt nur Lesezugriff auf das Repository
permissions:
  contents: read

jobs:
  publish-to-marketplace:
    runs-on: ubuntu-latest
    steps:
      # Schritt 1: Quellcode des freigegebenen Release-Stands aus dem Repository auschecken.
      - name: Checkout Code
        uses: actions/checkout@v4

      # Schritt 2: JDK 21 (Zulu-Distribution) für den Build- und Veröffentlichungsprozess bereitstellen.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # Schritt 3: Gradle einrichten und automatisches Caching der Build-Dependencies aktivieren.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Schritt 4: Plugin bauen und direkt im JetBrains Marketplace veröffentlichen.
      # Das IntelliJ Platform Gradle Plugin (2.x) erwartet das Marketplace-Upload-Token über
      # INTELLIJ_PLATFORM_PUBLISH_TOKEN (mit Fallback auf JB_MARKETPLACE_TOKEN).
      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon
        env:
          INTELLIJ_PLATFORM_PUBLISH_TOKEN: ${{ secrets.JB_MARKETPLACE_TOKEN }}
          JB_MARKETPLACE_TOKEN: ${{ secrets.JB_MARKETPLACE_TOKEN }}
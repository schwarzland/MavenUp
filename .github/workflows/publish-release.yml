name: Publish Release to Marketplace

on:
  # Wird ausgelöst, wenn ein Release veröffentlicht wird
  release:
    types: [published]

# Least-Privilege: Der Job benötigt nur Lesezugriff auf das Repository
permissions:
  contents: read

jobs:
  publish-to-marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon
        env:
          INTELLIJ_PLATFORM_PUBLISH_TOKEN: ${{ secrets.JB_MARKETPLACE_TOKEN }}
          JB_MARKETPLACE_TOKEN: ${{ secrets.JB_MARKETPLACE_TOKEN }}
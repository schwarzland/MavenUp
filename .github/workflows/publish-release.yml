name: Publish Release to Marketplace

on:
  # Wird ausgelöst, wenn ein Release veröffentlicht wird
  release:
    types: [published]

# Least-Privilege: Der Job benötigt nur Lesezugriff auf das Repository
permissions:
  contents: read


# Verhindert parallele Publish-Läufe für denselben Release-Ref.
# Ein weiterer Lauf wird nicht abgebrochen, sondern wartet, damit kein Release doppelt hochgeladen wird.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-to-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Schritt 1: Gemeinsame Build-Umgebung mit Checkout, JDK 21 und Gradle einrichten.
      - name: Set up build environment
        uses: ./.github/actions/setup

      # Schritt 2: Plugin vor der Veröffentlichung verifizieren.
      - name: Verify Plugin
        run: ./gradlew verifyPlugin --no-daemon

      # Schritt 3: Plugin-Kompatibilität mit den unterstützten IntelliJ-IDE-Builds prüfen.
      - name: Verify Plugin Compatibility
        run: ./gradlew runPluginVerifier --no-daemon

      # Schritt 4: Verifier-Report bei einem Fehler zur Diagnose als Artefakt sichern.
      - name: Upload Plugin Verifier Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
          retention-days: 7

      # Schritt 5: Plugin bauen und als verborgenes Release im JetBrains Marketplace veröffentlichen.
      # Das IntelliJ Platform Gradle Plugin (2.x) erwartet das Marketplace-Upload-Token über
      # die Umgebungsvariable PUBLISH_TOKEN.
      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin -PmarketplaceHidden=true --no-daemon
        env:
          PUBLISH_TOKEN: ${{ secrets.JB_MARKETPLACE_TOKEN }}

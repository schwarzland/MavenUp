name: Dependency Submission

on:
  # Der Dependency-Graph beschreibt immer den Stand des Standard-Branches. Deshalb laeuft
  # die Uebermittlung ausschliesslich auf 'main' und nur dann, wenn sich die Build- oder
  # Abhaengigkeitskonfiguration tatsaechlich geaendert hat.
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/dependency-submission.yml'

  # Manueller Trigger, um den Graph nach Bedarf neu zu erzeugen (z. B. nach Aenderungen
  # an den Repository-Einstellungen oder zum erstmaligen Befuellen).
  workflow_dispatch:

# Least-Privilege: 'contents: write' ist die Mindestberechtigung der Dependency
# Submission API, ueber die der aufgeloeste Abhaengigkeitsgraph an GitHub gemeldet wird.
permissions:
  contents: write

# Bei mehreren Pushes auf main laufende Uebermittlungen abbrechen; nur der neueste
# Abhaengigkeitsgraph ist relevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Schritt 1: Repository auschecken.
      - name: Checkout Code
        uses: actions/checkout@v7

      # Schritt 2: JDK bereitstellen. Die gemeinsame Composite-Action './.github/actions/setup'
      # wird hier bewusst NICHT verwendet, weil sie zusaetzlich 'gradle/actions/setup-gradle'
      # ausfuehrt; 'dependency-submission' bringt die Gradle-Konfiguration bereits selbst mit.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      # Schritt 3: Alle Konfigurationen aufloesen und den vollstaendigen Abhaengigkeitsgraph
      # (inklusive transitiver Abhaengigkeiten) an GitHub uebermitteln. Erst dadurch kann
      # Dependabot fuer dieses Gradle-Projekt Sicherheitswarnungen zu transitiven
      # Abhaengigkeiten melden, und 'actions/dependency-review-action' erhaelt eine
      # belastbare Vergleichsbasis.
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
